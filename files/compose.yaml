services:
  fika-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SPT_VERSION: ${SPT_VERSION:?Set SPT_VERSION in .env}
        SPT_DIGEST: ${SPT_DIGEST:?Set SPT_DIGEST in .env}
        FIKA_VERSION: ${FIKA_VERSION:?Set FIKA_VERSION in .env}
    image: fika-spt:${SPT_VERSION}-fika-${FIKA_VERSION}
    container_name: fika
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-6969}:6969"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./spt-user:/opt/spt/user
